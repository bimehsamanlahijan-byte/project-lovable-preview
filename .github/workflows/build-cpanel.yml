# (اختیاری) ساخت بسته آماده‌ی cPanel — فقط با اجرای دستی؛ روی دیپلوی Cloudflare اثری ندارد.
name: Build for cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: Build (node-server preset)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build:cpanel
      - name: Package
        run: |
          mkdir -p cpanel-build/scripts cpanel-build/cpanel cpanel-build/node_modules
          cp -r .output app.cjs package.json CPANEL.md cpanel-build/
          cp scripts/build-cpanel.mjs cpanel-build/scripts/
          cp cpanel/.env.example cpanel/htaccess.example cpanel/websocket-polyfill.cjs cpanel-build/cpanel/
          cp cpanel/.env.example cpanel-build/.env.example
          # `ws` gives Node 20 (cPanel) a WebSocket implementation; it has no deps.
          npm install ws --no-save --silent
          cp -r node_modules/ws cpanel-build/node_modules/ws
          cd cpanel-build && zip -qr ../cpanel-build.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: cpanel-build
          path: cpanel-build.zip
