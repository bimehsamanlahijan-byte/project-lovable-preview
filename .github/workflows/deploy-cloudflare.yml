# انتشار خودکار روی Cloudflare بعد از هر push به شاخه اصلی
# پیش‌نیازها (در Settings → Secrets and variables → Actions ثبت شوند):
#   CLOUDFLARE_API_TOKEN          — توکن با دسترسی Workers/Pages Deploy
#   CLOUDFLARE_ACCOUNT_ID         — شناسه حساب Cloudflare
#   VITE_SUPABASE_URL             — آدرس سرویس داده (سمت مرورگر — در بیلد پخته می‌شود)
#   VITE_SUPABASE_PUBLISHABLE_KEY — کلید عمومی سمت مرورگر
#   VITE_SUPABASE_PROJECT_ID      — شناسه پروژه سرویس داده
#
# متغیرهای زمان اجرا (Runtime) در پنل Cloudflare روی Worker تنظیم می‌شوند
# (Workers & Pages → <worker> → Settings → Variables and Secrets) و در دیپلوی حفظ می‌گردند:
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   LOVABLE_API_KEY, DASHBOARD_PASSWORD, SESSION_SECRET, GITHUB_API_KEY (اختیاری)

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Fix wrangler config (worker name, nodejs_compat, assets path)
        env:
          WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: |
          test -f dist/server/wrangler.json
          test -d dist/client
          node -e '
            const fs = require("fs");
            const p = "dist/server/wrangler.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            if (process.env.WORKER_NAME) c.name = process.env.WORKER_NAME;
            const flags = new Set(c.compatibility_flags || []);
            flags.add("nodejs_compat");
            c.compatibility_flags = [...flags];
            c.assets = { ...(c.assets || {}), binding: "ASSETS", directory: "../client" };
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log(c);
          '

      - name: Deploy with Wrangler
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy --config wrangler.json

